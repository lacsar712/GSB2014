version: '3.8'

services:
  web:
    build: .
    ports:
      - "8014:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - jingju-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wupengyuan
    ports:
      - "3314:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - db-data:/var/lib/mysql
    networks:
      - jingju-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8015:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - jingju-network

volumes:
  db-data:


networks:
  jingju-network:
    driver: bridge
